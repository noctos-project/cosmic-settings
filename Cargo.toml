[workspace]
members = [
    "cosmic-settings",
    "page",
    "pages/*",
    "subscriptions/*",
    "theme-bundle-config",
]
default-members = ["cosmic-settings"]
resolver = "3"

[workspace.package]
rust-version = "1.95"

[workspace.dependencies]
cosmic-randr = { git = "https://github.com/pop-os/cosmic-randr" }
tokio = { version = "1.53.1", features = ["macros"] }
iced_winit = { git = "https://github.com/pop-os/libcosmic", default-features = false }
image = { version = "0.25.10", default-features = false, features = [
    "jpeg",
    "png",
    "rayon",
    "webp",
    "hdr",
] }
fontdb = "0.23.0"
tracing = "0.1.44"
walkdir = "=2.5.0"
jxl-image-rs-integration = "0.8"

[workspace.dependencies.libcosmic]
features = [
    "dbus-config",
    "desktop",
    "multi-window",
    "winit",
    "tokio",
    "qr_code",
]
git = "https://github.com/pop-os/libcosmic"

[workspace.dependencies.ron]
version = "0.8"

[workspace.dependencies.serde]
version = "1"
features = ["derive"]

[workspace.dependencies.zip]
version = "2"

[workspace.dependencies.cosmic-config]
git = "https://github.com/pop-os/libcosmic"

[workspace.dependencies.cosmic-theme]
git = "https://github.com/pop-os/libcosmic"

[workspace.dependencies.cosmic-bg-config]
git = "https://github.com/pop-os/cosmic-bg"

[workspace.dependencies.cosmic-comp-config]
git = "https://github.com/pop-os/cosmic-comp"
features = ["output"]
default-features = false

[workspace.dependencies.cosmic-idle-config]
git = "https://github.com/pop-os/cosmic-idle"

[workspace.dependencies.cosmic-panel-config]
git = "https://github.com/pop-os/cosmic-panel"

[workspace.dependencies.cosmic-randr-shell]
git = "https://github.com/pop-os/cosmic-randr"

[workspace.dependencies.sctk]
version = "0.20"
package = "smithay-client-toolkit"

[profile.dev]
opt-level = 3
lto = "off"

[profile.release]
opt-level = 3
lto = "thin"
panic = "abort"

[profile.release-with-debug]
inherits = "release"
lto = "off"
debug = true

